# ===============================
# SERVER CONFIG
# ===============================
server.port=8082


# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/chronosync_db
spring.datasource.username=chronosync
spring.datasource.password=ChronoSync@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Remove explicit dialect (Hibernate auto-detects)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ===============================
# LOGGING (IMPORTANT FOR VERIFICATION)
# ===============================

# Show SQL clearly
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Show scheduler logs
logging.level.org.springframework.scheduling=DEBUG

# Show application logs clearly
logging.level.root=INFO


